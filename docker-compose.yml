services:

    webserver:
      image: nginx:alpine
      working_dir: /application
      volumes:
          - .:/application
          - ./phpdocker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      ports:
       - "8000:80"

    php-fpm:
      build: phpdocker/php-fpm
      working_dir: /application
      environment:
        COMPOSER_HOME: /application/.cache/composer
        COMPOSER_ALLOW_SUPERUSER: "1"
        COMPOSER_ROOT_VERSION: 2.0-dev
        NPM_CONFIG_CACHE: /application/.cache/npm
        CYPRESS_CACHE_FOLDER: /application/.cache/Cypress
      volumes:
        - .:/application
        - ./phpdocker/php-fpm/php-ini-overrides.ini:/usr/local/etc/php/conf.d/99-overrides.ini
